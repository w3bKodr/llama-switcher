[package]
name = "llama-switcher-widget"
version = "0.1.0"
description = "Desktop telemetry widget for Llama Switcher"
authors = ["Llama Switcher"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "llama_switcher_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
ureq = { version = "2", default-features = false }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
